<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">WonderVerse kids discovery app concept</title>
  <desc id="desc">A playful museum-style learning world with a glowing AI companion, floating themed rooms, quests, and XP progression.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f2c"/>
      <stop offset="0.55" stop-color="#171038"/>
      <stop offset="1" stop-color="#2a1242"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6a7" stop-opacity="0.92"/>
      <stop offset="0.35" stop-color="#ffb86b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.45" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff8f6b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="roomA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57d6c4"/>
      <stop offset="1" stop-color="#2b8cff"/>
    </linearGradient>
    <linearGradient id="roomB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a76"/>
      <stop offset="1" stop-color="#ff5f9e"/>
    </linearGradient>
    <linearGradient id="roomC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b59bff"/>
      <stop offset="1" stop-color="#6d5cff"/>
    </linearGradient>
    <linearGradient id="roomD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8e063"/>
      <stop offset="1" stop-color="#2ecc94"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <g fill="#ffffff">
    <circle cx="180" cy="140" r="2" opacity="0.7"/>
    <circle cx="340" cy="250" r="1.6" opacity="0.45"/>
    <circle cx="520" cy="120" r="2.4" opacity="0.55"/>
    <circle cx="730" cy="210" r="1.4" opacity="0.5"/>
    <circle cx="940" cy="130" r="1.8" opacity="0.6"/>
    <circle cx="1180" cy="235" r="2.2" opacity="0.5"/>
    <circle cx="1360" cy="140" r="1.5" opacity="0.65"/>
    <circle cx="1470" cy="300" r="2" opacity="0.4"/>
    <circle cx="118" cy="420" r="1.6" opacity="0.4"/>
    <circle cx="290" cy="560" r="1.8" opacity="0.35"/>
    <circle cx="1500" cy="520" r="1.7" opacity="0.35"/>
    <circle cx="1290" cy="700" r="2" opacity="0.3"/>
    <circle cx="420" cy="760" r="1.5" opacity="0.3"/>
  </g>

  <circle cx="800" cy="560" r="420" fill="url(#halo)" opacity="0.55"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.10">
    <ellipse cx="800" cy="560" rx="390" ry="160" stroke-width="2"/>
    <ellipse cx="800" cy="560" rx="520" ry="230"/>
    <ellipse cx="800" cy="560" rx="640" ry="305"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="655" y="70" width="290" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="800" y="96" fill="#c9c1ff" font-size="15" letter-spacing="3.4">KIDS DISCOVERY APP</text>
    <text x="800" y="190" fill="#ffffff" font-size="86" font-weight="700" letter-spacing="-3">Wonder<tspan fill="#ffcf7a">Verse</tspan></text>
    <text x="800" y="234" fill="#cfc8ec" font-size="24">A little museum for big curiosity.</text>
  </g>

  <g opacity="0.85">
    <g transform="translate(300 470)">
      <rect x="-20" y="-20" width="210" height="250" rx="30" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect x="20" y="22" width="130" height="112" rx="20" fill="url(#roomA)" opacity="0.9"/>
      <path d="M45 110c16-34 32-34 48 0 10 22 22 22 34 0" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
      <circle cx="108" cy="52" r="13" fill="#ffffff" opacity="0.85"/>
      <rect x="20" y="156" width="120" height="11" rx="5.5" fill="#ffffff" opacity="0.75"/>
      <rect x="20" y="180" width="86" height="9" rx="4.5" fill="#ffffff" opacity="0.35"/>
    </g>
    <g transform="translate(1090 430)">
      <rect x="-20" y="-20" width="210" height="250" rx="30" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect x="20" y="22" width="130" height="112" rx="20" fill="url(#roomB)" opacity="0.9"/>
      <circle cx="85" cy="78" r="34" fill="#ffffff" opacity="0.9"/>
      <circle cx="98" cy="68" r="9" fill="#ff8f6b" opacity="0.55"/>
      <path d="M32 104c20-12 40-12 60 0 14 8 28 8 42 0" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
      <rect x="20" y="156" width="128" height="11" rx="5.5" fill="#ffffff" opacity="0.75"/>
      <rect x="20" y="180" width="74" height="9" rx="4.5" fill="#ffffff" opacity="0.35"/>
    </g>
    <g transform="translate(230 690)">
      <rect x="-20" y="-20" width="190" height="200" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.14"/>
      <rect x="18" y="18" width="114" height="94" rx="18" fill="url(#roomC)" opacity="0.9"/>
      <path d="M45 82l22-30 18 22 15-18 16 26z" fill="#ffffff" opacity="0.88"/>
      <circle cx="102" cy="43" r="9" fill="#ffffff" opacity="0.9"/>
      <rect x="18" y="132" width="104" height="10" rx="5" fill="#ffffff" opacity="0.7"/>
    </g>
    <g transform="translate(1180 700)">
      <rect x="-20" y="-20" width="190" height="200" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.14"/>
      <rect x="18" y="18" width="114" height="94" rx="18" fill="url(#roomD)" opacity="0.9"/>
      <path d="M75 34c18 18 26 34 0 62-26-28-18-44 0-62z" fill="#ffffff" opacity="0.9"/>
      <path d="M75 54v38" stroke="#2ecc94" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
      <rect x="18" y="132" width="110" height="10" rx="5" fill="#ffffff" opacity="0.7"/>
    </g>
  </g>

  <g>
    <circle cx="800" cy="548" r="130" fill="#ffbf73" opacity="0.35" filter="url(#soft)"/>
    <circle cx="800" cy="548" r="78" fill="url(#orb)" filter="url(#glow)"/>
    <circle cx="776" cy="524" r="24" fill="#ffffff" opacity="0.55" filter="url(#soft)"/>
    <circle cx="776" cy="536" r="7" fill="#3a2b4f"/>
    <circle cx="824" cy="536" r="7" fill="#3a2b4f"/>
    <path d="M780 566c13 12 27 12 40 0" fill="none" stroke="#3a2b4f" stroke-width="6" stroke-linecap="round"/>
    <circle cx="756" cy="556" r="7" fill="#ff8f6b" opacity="0.55"/>
    <circle cx="844" cy="556" r="7" fill="#ff8f6b" opacity="0.55"/>
    <g fill="none" stroke="#ffe6a7" stroke-width="3" opacity="0.65">
      <ellipse cx="800" cy="548" rx="118" ry="42" transform="rotate(-18 800 548)"/>
      <ellipse cx="800" cy="548" rx="148" ry="54" transform="rotate(24 800 548)" opacity="0.4"/>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="688" y="660" width="224" height="46" rx="23" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="800" y="690" fill="#ffe6b8" text-anchor="middle" font-size="20" letter-spacing="2.5">LUMI · YOUR GUIDE</text>

    <g transform="translate(430 840)">
      <rect x="0" y="0" width="190" height="52" rx="26" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="95" y="22" fill="#ffffff" text-anchor="middle" font-size="12" letter-spacing="1.8" opacity="0.6">DISCOVERIES</text>
      <text x="95" y="41" fill="#ffcf7a" text-anchor="middle" font-size="17" font-weight="700">Seven rooms</text>
    </g>
    <g transform="translate(640 840)">
      <rect x="0" y="0" width="150" height="52" rx="26" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="75" y="22" fill="#ffffff" text-anchor="middle" font-size="12" letter-spacing="1.8" opacity="0.6">QUESTS</text>
      <text x="75" y="41" fill="#ffcf7a" text-anchor="middle" font-size="17" font-weight="700">Daily</text>
    </g>
    <g transform="translate(810 840)">
      <rect x="0" y="0" width="190" height="52" rx="26" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="95" y="22" fill="#ffffff" text-anchor="middle" font-size="12" letter-spacing="1.8" opacity="0.6">PROGRESS</text>
      <text x="95" y="41" fill="#ffcf7a" text-anchor="middle" font-size="17" font-weight="700">XP · Levels</text>
    </g>
    <g transform="translate(1020 840)">
      <rect x="0" y="0" width="150" height="52" rx="26" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="75" y="22" fill="#ffffff" text-anchor="middle" font-size="12" letter-spacing="1.8" opacity="0.6">WORLD</text>
      <text x="75" y="41" fill="#ffcf7a" text-anchor="middle" font-size="17" font-weight="700">7 continents</text>
    </g>
  </g>

  <rect x="0" y="960" width="1600" height="40" fill="url(#floor)"/>
  <text x="800" y="952" fill="#cfc8ec" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2.4" opacity="0.7">REACT  /  TYPESCRIPT  /  TAILWIND CSS  /  LOVABLE AI</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">LifeFlow AI product concept</title>
  <desc id="desc">A concept illustration connecting personal documents, AI-assisted planning, and approved reminders. Planned architecture, not a screenshot of a built application.</desc>
  <rect width="1600" height="1000" fill="#182722"/>
  <circle cx="800" cy="550" r="340" fill="none" stroke="#30483d" stroke-width="2"/>
  <circle cx="800" cy="550" r="260" fill="none" stroke="#30483d"/>
  <path d="M0 850H1600M0 851L700 1000M1600 851L900 1000" stroke="#30483d" fill="none"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" transform="translate(0 60)">

    <text x="342" y="677" fill="#b5c6bc" text-anchor="middle" font-size="17">Deadlines, made clear</text>
    <rect x="615" y="372" width="370" height="406" rx="30" fill="#e4e9d9"/>
    <rect x="634" y="391" width="332" height="368" rx="19" fill="#f3f3e9"/>
    <rect x="751" y="406" width="98" height="7" rx="3.5" fill="#b4bead"/>

    <text x="800" y="228" fill="#eef2e8" font-size="92" font-weight="600" letter-spacing="-4">LifeFlow <tspan fill="#bad7ad">AI</tspan></text>
    <text x="800" y="283" fill="#b5c6bc" font-size="26">Organize Life. Automate the Important.</text>
  </g>
